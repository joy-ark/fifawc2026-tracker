<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — Schedule & Results</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap');

  :root {
    --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c26; --border: #2a2a38;
    --accent: #c9a73a; --accent2: #4e9af1; --text: #e8e8f0; --muted: #6b6b80;
    --live: #e84040; --win: #3dba6a; --scheduled: #4e9af1;
    --font-display: 'Bebas Neue', sans-serif; --font-body: 'Inter', sans-serif;
  }
  [data-theme="light"] {
    --bg: #f4f4f8; --surface: #ffffff; --surface2: #f0f0f5; --border: #dddde8;
    --accent: #a07c10; --accent2: #2266cc; --text: #1a1a2e; --muted: #7070a0;
    --live: #cc2020; --win: #1a8040; --scheduled: #2266cc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; font-size: 14px; transition: background .2s, color .2s; }

  /* ── Header ── */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .trophy { font-size: 26px; }
  .title-block h1 { font-family: var(--font-display); font-size: 20px; letter-spacing: 1px; color: var(--accent); line-height: 1; }
  .title-block p { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: .5px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .live-badge { display: none; align-items: center; gap: 6px; background: rgba(232,64,64,.12); border: 1px solid rgba(232,64,64,.3); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; color: var(--live); letter-spacing: 1px; }
  .live-badge.visible { display: flex; }
  .pulse { width: 6px; height: 6px; background: var(--live); border-radius: 50%; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
  .last-updated { font-size: 11px; color: var(--muted); }
  .icon-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: var(--font-body); transition: border-color .2s, color .2s; display: flex; align-items: center; gap: 5px; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Tabs ── */
  .tabs { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 0; padding: 0 24px; position: sticky; top: 61px; z-index: 99; }
  .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 18px; cursor: pointer; font-size: 13px; font-family: var(--font-body); font-weight: 500; transition: color .15s, border-color .15s; white-space: nowrap; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── Controls (Schedule tab) ── */
  .controls { padding: 12px 24px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--surface); align-items: center; }
  .filter-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 5px 13px; border-radius: 20px; cursor: pointer; font-size: 12px; font-family: var(--font-body); transition: all .15s; white-space: nowrap; }
  .filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(201,167,58,.08); }
  .filter-btn.live-filter.active { border-color: var(--live); color: var(--live); background: rgba(232,64,64,.08); }
  .search-input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 5px 13px; border-radius: 20px; font-size: 12px; font-family: var(--font-body); outline: none; width: 160px; transition: border-color .15s; }
  .search-input:focus { border-color: var(--accent2); }
  .search-input::placeholder { color: var(--muted); }

  /* ── Stats bar ── */
  .stats-bar { display: flex; gap: 20px; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .stat-item strong { color: var(--text); font-weight: 600; }
  .stat-item.live-stat strong { color: var(--live); }

  /* ── Tab panels ── */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Schedule panel ── */
  .main { padding: 0 24px 40px; max-width: 1100px; margin: 0 auto; }
  .day-block { margin-top: 24px; }
  .day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .day-today { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--accent); background: rgba(201,167,58,.1); border: 1px solid rgba(201,167,58,.25); padding: 2px 7px; border-radius: 4px; }
  .day-date { font-family: var(--font-display); font-size: 18px; color: var(--text); letter-spacing: 1px; }
  .day-line { flex: 1; height: 1px; background: var(--border); }
  .match-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; position: relative; overflow: hidden; transition: border-color .15s; cursor: pointer; }
  .match-card::before { content:''; position:absolute; left:0;top:0;bottom:0; width:3px; background:var(--border); }
  .match-card.live::before { background: var(--live); }
  .match-card.finished::before { background: var(--win); }
  .match-card.scheduled::before { background: var(--scheduled); }
  .match-card:hover { border-color: var(--muted); }
  .team { display:flex; align-items:center; gap:10px; }
  .team.away { flex-direction:row-reverse; }
  .team-flag { font-size:20px; line-height:1; }
  .team-name { font-weight:600; font-size:14px; color:var(--text); }
  .team.away .team-name { text-align:right; }
  .score-block { text-align:center; min-width:90px; }
  .score { font-family:var(--font-display); font-size:26px; letter-spacing:4px; line-height:1; color:var(--text); }
  .score.live-score { color:var(--live); }
  .status-pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; letter-spacing:.5px; margin-top:4px; }
  .status-pill.live { background:rgba(232,64,64,.15); color:var(--live); }
  .status-pill.finished { background:rgba(61,186,106,.12); color:var(--win); }
  .status-pill.scheduled { background:rgba(78,154,241,.12); color:var(--scheduled); }
  .match-footer { grid-column: 1/-1; display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:8px; margin-top:2px; }
  .match-venue { font-size:11px; color:var(--muted); }
  .stage-badge { font-size:10px; font-weight:600; letter-spacing:.5px; padding:2px 7px; border-radius:4px; background:rgba(201,167,58,.1); color:var(--accent); }
  .stage-badge.r32 { background:rgba(78,154,241,.1); color:var(--accent2); }
  .stage-badge.r16 { background:rgba(147,112,219,.1); color:#9070d0; }
  .stage-badge.qf  { background:rgba(255,140,0,.1); color:#e08020; }
  .stage-badge.sf  { background:rgba(220,80,80,.1); color:#dd5050; }
  .stage-badge.tp  { background:rgba(120,120,120,.1); color:var(--muted); }
  .stage-badge.final { background:rgba(201,167,58,.2); color:var(--accent); border:1px solid rgba(201,167,58,.3); }

  /* ── Bracket panel (flex tree, self-aligning) ── */
  .bracket-panel { padding: 20px 24px 40px; overflow-x: auto; }
  .bracket-title { font-family: var(--font-display); font-size: 14px; letter-spacing: 2px; color: var(--muted); margin-bottom: 20px; }
  .round-header { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-align: center; padding: 0 8px 12px; text-transform: uppercase; white-space: nowrap; }
  .round-header small { font-weight: 400; letter-spacing: 0; display: block; margin-top: 2px; font-size: 9px; }

  /* ── Tree node structure ──
     .bt-node  = flex column: [.bt-branch-top, .bt-card-wrap, .bt-branch-bot]
     .bt-branch = flex row: [.bt-vline, .bt-hline] — draws the L-shaped connector
     .bt-children = flex column of two .bt-node children
     The parent .bt-card-wrap naturally centres between the two child branches.
  */
  .bt-round { display: flex; flex-direction: column; align-items: center; }
  .bt-round-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-align: center; padding: 0 4px 10px; text-transform: uppercase; white-space: nowrap; }
  .bt-round-label small { font-weight: 400; letter-spacing: 0; display: block; margin-top: 1px; font-size: 9px; }

  .bt-col { display: flex; flex-direction: column; align-items: stretch; }
  .bt-row { display: flex; flex-direction: row; align-items: stretch; }

  /* A node = children column + connector + card */
  .bt-node { display: flex; flex-direction: row; align-items: center; }
  .bt-children { display: flex; flex-direction: column; justify-content: space-around; }
  .bt-child-group { display: flex; flex-direction: column; }

  /* Connector between children column and parent card:
     vertical bar spanning the full height of the two children,
     with two horizontal stubs meeting at the midpoint of each child */
  .bt-connector-l { display: flex; flex-direction: column; width: 16px; align-self: stretch; }
  .bt-connector-r { display: flex; flex-direction: column; width: 16px; align-self: stretch; }
  .bt-conn-top { flex: 1; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); border-radius: 0 0 4px 0; }
  .bt-conn-bot { flex: 1; border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-radius: 0 4px 0 0; }
  .bt-conn-top-l { flex: 1; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); border-radius: 0 0 0 4px; }
  .bt-conn-bot-l { flex: 1; border-top: 1px solid var(--border); border-left: 1px solid var(--border); border-radius: 4px 0 0 0; }

  /* Horizontal stub from card edge to connector bar */
  .bt-stub-r { width: 10px; height: 1px; background: var(--border); align-self: center; flex-shrink: 0; }
  .bt-stub-l { width: 10px; height: 1px; background: var(--border); align-self: center; flex-shrink: 0; }

  /* Match card — same visual as before */
  .b-match { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font-size: 12px; transition: border-color .2s; width: 148px; flex-shrink: 0; cursor: pointer; }
  .b-match:hover { border-color: var(--muted); }
  .b-match.live { border-color: rgba(232,64,64,.5); }
  .b-team { display: flex; align-items: center; gap: 7px; padding: 6px 10px; border-bottom: 1px solid var(--border); min-height: 32px; }
  .b-team:last-child { border-bottom: none; }
  .b-team.winner { background: rgba(61,186,106,.07); }
  .b-team.winner .b-team-name { color: var(--win); font-weight: 700; }
  .b-team-flag { font-size: 14px; line-height: 1; flex-shrink: 0; }
  .b-team-name { font-size: 11px; font-weight: 500; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-team-score { font-family: var(--font-display); font-size: 14px; color: var(--text); margin-left: auto; min-width: 14px; text-align: right; }
  .b-team.tbd .b-team-name { color: var(--muted); font-weight: 400; font-style: italic; }
  .b-match-meta { font-size: 9px; color: var(--muted); padding: 3px 10px; background: var(--surface2); border-top: 1px solid var(--border); display: flex; justify-content: space-between; }

  /* Trophy / final marker */
  .trophy-slot { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 80px; gap: 8px; }
  .trophy-icon { font-size: 36px; }
  .trophy-date { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 1px; }
  .bracket-center { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 12px; gap: 16px; }

  /* ── Match detail modal ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .modal-overlay.visible { display: flex; }
  .modal-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; max-width: 480px; width: 100%; overflow: hidden; animation: modalIn .15s ease-out; }
  @keyframes modalIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

  .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .modal-stage { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
  .modal-venue { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .modal-close { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; line-height: 1; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .modal-close:hover { color: var(--text); border-color: var(--accent); }

  .modal-score-row { display: flex; align-items: center; justify-content: center; gap: 24px; padding: 24px 20px; }
  .modal-team { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
  .modal-team-flag { font-size: 32px; }
  .modal-team-name { font-size: 13px; font-weight: 600; text-align: center; color: var(--text); }
  .modal-team-name.winner { color: var(--win); }
  .modal-score-big { font-family: var(--font-display); font-size: 40px; letter-spacing: 2px; color: var(--text); display: flex; align-items: center; gap: 10px; }
  .modal-score-big .vs-divider { font-size: 18px; color: var(--muted); font-family: var(--font-body); }
  .shootout-score { font-size: 18px; color: var(--accent); margin-left: 4px; }
  .modal-status-line { text-align: center; font-size: 11px; color: var(--muted); padding: 0 20px 16px; }

  .modal-section { padding: 16px 20px; border-top: 1px solid var(--border); }
  .modal-section-title { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
  .modal-recap { font-size: 13px; color: var(--text); line-height: 1.5; }

  .event-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; font-size: 12px; }
  .event-minute { font-family: var(--font-display); font-size: 13px; color: var(--muted); min-width: 38px; flex-shrink: 0; }
  .event-icon { font-size: 13px; flex-shrink: 0; width: 18px; text-align: center; }
  .event-text { flex: 1; color: var(--text); }
  .event-team-tag { font-size: 10px; color: var(--muted); margin-left: 4px; }
  .event-empty { font-size: 12px; color: var(--muted); font-style: italic; text-align: center; padding: 8px 0; }

  /* ── Stats tab ── */
  .stats-panel { padding: 20px 24px 40px; max-width: 700px; margin: 0 auto; }
  .stats-section-title { font-family: var(--font-display); font-size: 16px; letter-spacing: 1px; color: var(--accent); margin: 28px 0 12px; }
  .stats-section-title:first-child { margin-top: 0; }

  .leaderboard-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
  .leaderboard-rank { font-family: var(--font-display); font-size: 16px; color: var(--muted); min-width: 22px; }
  .leaderboard-rank.top { color: var(--accent); }
  .leaderboard-flag { font-size: 18px; }
  .leaderboard-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--text); }
  .leaderboard-team { font-size: 11px; color: var(--muted); }
  .leaderboard-goals { font-family: var(--font-display); font-size: 18px; color: var(--accent); min-width: 30px; text-align: right; }

  .stat-bar-row { margin-bottom: 8px; }
  .stat-bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .stat-bar-labels .stat-name { color: var(--text); font-weight: 500; }
  .stat-bar-track { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--border); }
  .stat-bar-home { background: var(--accent2); }
  .stat-bar-away { background: var(--accent); }
  .no-stats-msg { font-size: 12px; color: var(--muted); font-style: italic; text-align: center; padding: 30px 0; }

  /* ── Misc ── */
  .loading { text-align:center; padding:60px; color:var(--muted); }
  .spinner { width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
  .error-banner { background:rgba(232,64,64,.08); border:1px solid rgba(232,64,64,.2); color:#f08080; padding:12px 18px; border-radius:8px; margin:20px 0 0; font-size:13px; display:none; }
  .error-banner.visible { display:block; }

  @media(max-width:700px){
    header{padding:10px 14px;}
    .tabs{padding:0 14px; top:57px;}
    .main{padding:0 14px 40px;}
    .match-card{padding:12px 12px; gap:8px;}
    .team-name{font-size:12px;}
    .score{font-size:20px;}
    .team-flag{font-size:17px;}
    .title-block h1{font-size:17px;}
    .bracket-panel{padding:16px 14px 40px;}
  }

  /* ── Floating export toolbar ── */
  .export-toolbar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 10px 18px;
    box-shadow: 0 4px 24px rgba(0,0,0,.35);
    z-index: 150;
    white-space: nowrap;
  }
  .export-toolbar.visible { display: flex; }
  .export-label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .export-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-family: var(--font-body);
    outline: none;
    cursor: pointer;
  }
  .export-btn {
    background: var(--accent);
    border: none;
    color: #000;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    font-family: var(--font-body);
    cursor: pointer;
    transition: opacity .15s;
  }
  .export-btn:hover { opacity: .85; }

</style>
</head>
<body data-theme="dark" onload="initTheme()">

<!-- ── Header ── -->
<header>
  <div class="header-left">
    <div class="trophy">🏆</div>
    <div class="title-block">
      <h1>FIFA WORLD CUP 2026</h1>
      <p>ALL 104 MATCHES · TIMES IN IST</p>
    </div>
  </div>
  <div class="header-right">
    <div class="live-badge" id="liveBadge"><div class="pulse"></div>LIVE</div>
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    <button class="icon-btn" onclick="fetchAll()">↻ Refresh</button>
  </div>
</header>

<!-- ── Tabs ── -->
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('schedule',this)">📅 Schedule</button>
  <button class="tab-btn" onclick="showTab('bracket',this)">🏆 Bracket</button>
  <button class="tab-btn" onclick="showTab('stats',this)">👟 Golden Boot Race</button>
</div>

<!-- ── Schedule tab ── -->
<div class="tab-panel active" id="tab-schedule">
  <div class="stats-bar" id="statsBar">
    <span class="stat-item"><strong>—</strong> Live</span>
    <span class="stat-item"><strong>—</strong> Today</span>
    <span class="stat-item"><strong>—</strong> Finished</span>
    <span class="stat-item"><strong>—</strong> Upcoming</span>
  </div>
  <div class="controls">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn live-filter" onclick="setFilter('live',this)">🔴 Live</button>
    <button class="filter-btn" onclick="setFilter('today',this)">Today</button>
    <button class="filter-btn" onclick="setFilter('upcoming',this)">Upcoming</button>
    <button class="filter-btn" onclick="setFilter('finished',this)">Finished</button>
    <button class="filter-btn" onclick="setFilter('group',this)">Group Stage</button>
    <button class="filter-btn" onclick="setFilter('r32',this)">R32</button>
    <button class="filter-btn" onclick="setFilter('r16',this)">R16</button>
    <button class="filter-btn" onclick="setFilter('qf',this)">QF</button>
    <button class="filter-btn" onclick="setFilter('sf',this)">SF</button>
    <button class="filter-btn" onclick="setFilter('final',this)">Final</button>
    <input class="search-input" id="searchInput" type="text" placeholder="Search team..." oninput="renderSchedule()">
  </div>
  <div class="main">
    <div class="error-banner" id="errorBanner"></div>
    <div id="scheduleContent"><div class="loading"><div class="spinner"></div>Loading matches…</div></div>
  </div>

  <!-- ── Floating export toolbar (Schedule tab only) ── -->
  <div class="export-toolbar" id="exportToolbar">
    <span class="export-label">📥 Export ICS</span>
    <select class="export-select" id="exportStage">
      <option value="all">All Matches</option>
      <option value="group">Group Stage</option>
      <option value="r32">Round of 32</option>
      <option value="r16">Round of 16</option>
      <option value="qf">Quarterfinals</option>
      <option value="sf">Semifinals</option>
      <option value="tp">3rd Place Match</option>
      <option value="final">Final</option>

    <button class="export-btn" onclick="exportICS()">Download</button>

</div>

<div class="tab-panel" id="tab-bracket">

    <div class="bracket-title">KNOCKOUT BRACKET · TIMES IN IST · UPDATES AFTER EACH MATCH</div>
    <div id="bracketContent"><div class="loading"><div class="spinner"></div>Loading bracket…</div></div>

<div class="tab-panel" id="tab-stats">
  <div class="stats-panel">

</div>

<!-- ── Match detail modal ── -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeMatchModal()">
  <div class="modal-panel" id="modalPanel"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════
// Constants & helpers
// ════════════════════════════════════════════════════════════
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?limit=200&dates=20260611-20260720';
const IST_OFFSET = 5.5 * 3600 * 1000;
const toIST = utc => new Date(new Date(utc).getTime() + IST_OFFSET);
const istDateKey = d => `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
const istTimeStr = d => d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'UTC'}).toUpperCase();
const istDateStr = d => d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const istShort = d => d.toLocaleDateString('en-IN',{month:'numeric',day:'numeric',timeZone:'UTC'}) + ', ' + istTimeStr(d);
const todayKey = () => istDateKey(toIST(new Date().toISOString()));

const FLAGS = {
  'Mexico':'🇲🇽','South Africa':'🇿🇦','Korea Republic':'🇰🇷','South Korea':'🇰🇷',
  'Czechia':'🇨🇿','Czech Republic':'🇨🇿','Canada':'🇨🇦','Bosnia and Herzegovina':'🇧🇦',
  'Bosnia-Herzegovina':'🇧🇦','Bosnia & Herzegovina':'🇧🇦','Bosnia-Herz':'🇧🇦','Qatar':'🇶🇦',
  'Switzerland':'🇨🇭','Paraguay':'🇵🇾','USA':'🇺🇸','United States':'🇺🇸','Brazil':'🇧🇷',
  'Morocco':'🇲🇦','Haiti':'🇭🇹','Scotland':'🏴󠁧󠁢󠁳󠁣󠁴󠁿','Australia':'🇦🇺','Türkiye':'🇹🇷','Turkey':'🇹🇷',
  'Germany':'🇩🇪','Curaçao':'🇨🇼','Curacao':'🇨🇼','Ivory Coast':'🇨🇮',
  "Côte d'Ivoire":'🇨🇮',"Cote d'Ivoire":'🇨🇮','Ecuador':'🇪🇨','Netherlands':'🇳🇱',
  'Japan':'🇯🇵','Sweden':'🇸🇪','Tunisia':'🇹🇳','Spain':'🇪🇸','Cape Verde':'🇨🇻',
  'Cabo Verde':'🇨🇻','Saudi Arabia':'🇸🇦','Uruguay':'🇺🇾','Belgium':'🇧🇪','Egypt':'🇪🇬',
  'Iran':'🇮🇷','New Zealand':'🇳🇿','France':'🇫🇷','Senegal':'🇸🇳','Iraq':'🇮🇶',
  'Norway':'🇳🇴','Argentina':'🇦🇷','Algeria':'🇩🇿','Austria':'🇦🇹','Jordan':'🇯🇴',
  'Portugal':'🇵🇹','DR Congo':'🇨🇩','Congo DR':'🇨🇩','Uzbekistan':'🇺🇿','Colombia':'🇨🇴',
  'England':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','Croatia':'🇭🇷','Ghana':'🇬🇭','Panama':'🇵🇦',
};
const flag = n => FLAGS[n] || '🏳️';

const STAGE_LABEL = { group:'GROUP', r32:'R32', r16:'R16', qf:'QF', sf:'SF', tp:'3RD', final:'FINAL' };
const STAGE_CLASS = { group:'', r32:'r32', r16:'r16', qf:'qf', sf:'sf', tp:'tp', final:'final' };

function detectStage(m) {
  const raw = [m._slug||'', m._altNote||''].join(' ').toLowerCase().replace(/[^a-z0-9 ]/g,' ');
  if (raw.includes('final') && !raw.includes('semi') && !raw.includes('quarter') && !raw.includes('third') && !raw.includes('place')) return 'final';
  if (raw.includes('third')||raw.includes('3rd')||raw.includes('place')) return 'tp';
  if (raw.includes('semi')) return 'sf';
  if (raw.includes('quarter')) return 'qf';
  if (raw.includes('16')) return 'r16';
  if (raw.includes('32')) return 'r32';
  if (raw.includes('group')) return 'group';
  return 'group';
}

// ════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════
let allMatches = [];
let currentFilter = 'all';
let activeTab = 'schedule';

// ════════════════════════════════════════════════════════════
// Fetch
// ════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════
// Stage-filtered ICS export
// ════════════════════════════════════════════════════════════
const IST_OFFSET_MS = 5.5 * 3600 * 1000;
const STAGE_ICS_LABEL = {
  all:'All Matches', group:'Group Stage', r32:'Round of 32',
  r16:'Round of 16', qf:'Quarterfinals', sf:'Semifinals',
  tp:'3rd Place Match', final:'Final'
};

function toISTDate(utcStr) {
  return new Date(new Date(utcStr).getTime() + IST_OFFSET_MS);
}

function fmtICS(dt) {
  // Format as YYYYMMDDTHHMMSS in UTC (we shift to IST then treat as floating local time)
  const p = n => String(n).padStart(2,'0');
  return `${dt.getUTCFullYear()}${p(dt.getUTCMonth()+1)}${p(dt.getUTCDate())}T${p(dt.getUTCHours())}${p(dt.getUTCMinutes())}00`;
}

function exportICS() {
  const stage = document.getElementById('exportStage').value;
  const label = STAGE_ICS_LABEL[stage] || stage;

  const filtered = stage === 'all'
    ? allMatches
    : allMatches.filter(m => m.stage === stage);

  if (!filtered.length) {
    alert('No matches found for this stage yet. Check back once the schedule is confirmed.');
    return;
  }

  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//FIFA WC 2026 Tracker//Schedule//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    `X-WR-CALNAME:FIFA WC 2026 – ${label}`,
    'X-WR-TIMEZONE:Asia/Kolkata',
  ];

  filtered.forEach((m, i) => {
    const ist     = toISTDate(m.date);
    const istEnd  = new Date(ist.getTime() + 2 * 3600 * 1000);
    const sl      = STAGE_ICS_LABEL[m.stage] || m.stage.toUpperCase();
    const summary = `🏆 WC2026 | ${sl}: ${m.home} vs ${m.away}`;
    const desc    = `${sl}\nVenue: ${m.venue}${m.city ? ', '+m.city : ''}\nKick-off: ${m.istTime} IST`;

    lines.push(
      'BEGIN:VEVENT',
      `UID:wc2026-export-${m.id}@tracker`,
      `DTSTART;TZID=Asia/Kolkata:${fmtICS(ist)}`,
      `DTEND;TZID=Asia/Kolkata:${fmtICS(istEnd)}`,
      `SUMMARY:${summary}`,
      `DESCRIPTION:${desc}`,
      `LOCATION:${m.venue}${m.city ? ', '+m.city : ''}`,
      'BEGIN:VALARM',
      'TRIGGER:-PT30M',
      'ACTION:DISPLAY',
      'DESCRIPTION:Match starts in 30 minutes!',
      'END:VALARM',
      'END:VEVENT'
    );
  });

  lines.push('END:VCALENDAR');

  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `WC2026_${label.replace(/ /g,'_')}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function fetchAll() {
  try {
    const res = await fetch(ESPN);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    allMatches = (data.events || []).map(ev => {
      const comp = ev.competitions?.[0] || {};
      const statusObj = comp.status || {};
      const status = statusObj.type || {};
      const comps = comp.competitors || [];
      const home = comps.find(c => c.homeAway === 'home') || comps[0] || {};
      const away = comps.find(c => c.homeAway === 'away') || comps[1] || {};
      const ist = toIST(ev.date);

      // Build a {abbreviation: displayValue} map per team from statistics[]
      const statMap = (competitor) => {
        const out = {};
        (competitor.statistics || []).forEach(s => { out[s.abbreviation] = s.displayValue; });
        return out;
      };

      const m = {
        id: ev.id,
        date: ev.date,
        ist,
        istKey: istDateKey(ist),
        istDate: istDateStr(ist),
        istTime: istTimeStr(ist),
        istShort: istShort(ist),
        home: home.team?.displayName || '?',
        away: away.team?.displayName || '?',
        homeScore: home.score ?? null,
        awayScore: away.score ?? null,
        // Penalty shootout fields, verified from a real FT-Pens sample:
        // competitor.shootoutScore is separate from the regular score, and
        // status.type.name becomes "STATUS_FINAL_PEN" with detail "FT-Pens".
        homeShootoutScore: home.shootoutScore ?? null,
        awayShootoutScore: away.shootoutScore ?? null,
        isShootout: status.name === 'STATUS_FINAL_PEN' || status.detail === 'FT-Pens',
        // notes[] is empty for normal matches but carries a clean human-readable
        // line for shootouts, e.g. "Paraguay advance 4-3 on penalties"
        advanceNote: comp.notes?.[0]?.headline || comp.notes?.[0]?.text || '',
        homeWinner: home.winner || false,
        awayWinner: away.winner || false,
        homeAdvance: home.advance || false,
        awayAdvance: away.advance || false,
        state: status.state || 'pre',
        statusDetail: status.shortDetail || '',
        // Verified from real ESPN sample: clock/displayClock/period sit on
        // comp.status directly, NOT inside comp.status.type.
        clockSeconds: statusObj.clock ?? null,
        displayClock: statusObj.displayClock || '',
        period: statusObj.period || null,
        venue: comp.venue?.fullName || '',
        city: (comp.venue?.address?.city || '').split(',')[0],
        attendance: comp.attendance || null,
        events: (comp.details || []).map(d => ({
          type: d.type?.text || '',
          minute: d.clock?.displayValue || '',
          teamId: d.team?.id || null,
          scoringPlay: !!d.scoringPlay,
          yellowCard: !!d.yellowCard,
          redCard: !!d.redCard,
          ownGoal: !!d.ownGoal,
          penaltyKick: !!d.penaltyKick,
          shootout: !!d.shootout,
          players: (d.athletesInvolved || []).map(a => a.displayName || a.shortName || '?'),
        })),
        recap: comp.headlines?.[0]?.description || '',
        homeId: home.team?.id || null,
        awayId: away.team?.id || null,
        // Team-level box score stats — only populated by ESPN for finished
        // (and some live) matches; empty object for scheduled matches.
        homeStats: statMap(home),
        awayStats: statMap(away),
        // Tournament leaders: each competitor carries a 'leaders' array with
        // the team's current top scorer (name + goal count), per real sample.
        homeLeader: home.leaders?.[0]?.leaders?.[0] || null,
        awayLeader: away.leaders?.[0]?.leaders?.[0] || null,
        _slug: ev.season?.slug || '',
        _altNote: comp.altGameNote || '',
      };
      m.stage = detectStage(m);
      return m;
    });

    allMatches.sort((a,b) => new Date(a.date) - new Date(b.date));

    const live = allMatches.filter(m => m.state === 'in').length;
    document.getElementById('liveBadge').classList.toggle('visible', live > 0);
    document.getElementById('lastUpdated').textContent = 'Updated ' + istTimeStr(toIST(new Date().toISOString())) + ' IST';

    updateStats();
    renderSchedule();
    renderBracket();
    renderStatsTab();
    document.getElementById('errorBanner').classList.remove('visible');

  } catch(err) {
    const eb = document.getElementById('errorBanner');
    eb.textContent = `Could not load from ESPN API: ${err.message}. Check your connection and try refreshing.`;
    eb.classList.add('visible');
  }
}

// ════════════════════════════════════════════════════════════
// Tab switching
// ════════════════════════════════════════════════════════════
function showTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
  // Show export toolbar only on Schedule tab
  document.getElementById('exportToolbar').classList.toggle('visible', tab === 'schedule');
}

function initTheme() {
  const saved = localStorage.getItem('wc2026_theme') || 'dark';
  document.body.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').textContent = saved === 'dark' ? '🌙 Dark' : '☀️ Light';
}

function toggleTheme() {
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.body.setAttribute('data-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '🌙 Dark' : '☀️ Light';
  localStorage.setItem('wc2026_theme', next);
}

// ════════════════════════════════════════════════════════════
// Match detail modal (events, attendance, recap)
// ════════════════════════════════════════════════════════════
// Verified from real ESPN response: competitions[0].details[] holds the event
// timeline (goals, cards, etc). Fields used: type.text, clock.displayValue,
// team.id, scoringPlay, yellowCard, redCard, ownGoal, penaltyKick,
// athletesInvolved[].displayName. competitions[0].attendance and
// competitions[0].headlines[0].description are also captured at fetch time.

function eventIcon(ev) {
  if (ev.redCard) return '🟥';
  if (ev.yellowCard) return '🟨';
  if (ev.ownGoal) return '⚽️➖';
  if (ev.shootout) return '🥅';
  if (ev.penaltyKick && ev.scoringPlay) return '⚽️🅿️';
  if (ev.scoringPlay) return '⚽️';
  return '•';
}

function eventLabel(ev) {
  const players = ev.players.length ? ev.players.join(', ') : '';
  if (ev.redCard) return `Red card${players ? ' — '+players : ''}`;
  if (ev.yellowCard) return `Yellow card${players ? ' — '+players : ''}`;
  if (ev.ownGoal) return `Own goal${players ? ' — '+players : ''}`;
  if (ev.shootout) {
    const result = ev.type.toLowerCase().includes('miss') || ev.type.toLowerCase().includes('saved') ? 'Missed' : 'Scored';
    return `Shootout penalty ${result}${players ? ' — '+players : ''}`;
  }
  if (ev.scoringPlay) {
    const tag = ev.penaltyKick ? ' (penalty)' : ev.type.toLowerCase().includes('header') ? ' (header)' : '';
    return `Goal${tag}${players ? ' — '+players : ''}`;
  }
  return `${ev.type || 'Event'}${players ? ' — '+players : ''}`;
}

// ════════════════════════════════════════════════════════════
// Stats tab: top scorers leaderboard + per-match team stats
// ════════════════════════════════════════════════════════════
// NOTE: ESPN's soccer scoreboard endpoint does not expose a full per-player
// box score (passes, touches, etc.) — only each team's current top scorer
// via competitor.leaders[0].leaders[0], confirmed from a real sample. So the
// "top scorers" section here is a tournament leaderboard built by deduping
// that one-leader-per-team field across all matches, not a full stat sheet.

// Friendly display names for the team-level stat abbreviations ESPN returns.
const STAT_LABELS = {
  PP: 'Possession %', SHOT: 'Total Shots', SOG: 'Shots on Target',
  FC: 'Fouls Committed', CW: 'Corners Won', A: 'Assists', G: 'Goals',
  SHAST: 'Shot Assists', APP: 'Appearances',
};
// Stats worth visualising as a bar comparison (skip noisy/redundant ones)
const STAT_BAR_ORDER = ['PP', 'SHOT', 'SOG', 'CW', 'FC'];

function renderLeaderboard() {
  // Build a map of player -> {team, goals} using the most recent (highest) value seen
  const byPlayer = {};
  allMatches.forEach(m => {
    [{ leader: m.homeLeader, team: m.home }, { leader: m.awayLeader, team: m.away }].forEach(({ leader, team }) => {
      if (!leader?.athlete?.displayName) return;
      const name = leader.athlete.displayName;
      const goals = leader.value || 0;
      if (!byPlayer[name] || goals > byPlayer[name].goals) {
        byPlayer[name] = { team, goals };
      }
    });
  });

  const ranked = Object.entries(byPlayer)
    .map(([name, d]) => ({ name, ...d }))
    .filter(p => p.goals > 0)
    .sort((a, b) => b.goals - a.goals)
    .slice(0, 15);

  if (!ranked.length) {
    document.getElementById('leaderboardContent').innerHTML = '<div class="no-stats-msg">No goal data yet — check back once matches kick off.</div>';
    return;
  }

  const html = ranked.map((p, i) => `
    <div class="leaderboard-row">
      <span class="leaderboard-rank${i===0?' top':''}">${i+1}</span>
      <span class="leaderboard-flag">${flag(p.team)}</span>
      <span class="leaderboard-name">${p.name}<div class="leaderboard-team">${p.team}</div></span>
      <span class="leaderboard-goals">${p.goals}</span>
    </div>`).join('');

  document.getElementById('leaderboardContent').innerHTML = html;
}

// Build the team-stats comparison bars for a single match — used inside the
// match detail modal. Returns '' if ESPN hasn't populated stats for this match.
function matchStatsHtml(m) {
  const hasStats = Object.keys(m.homeStats||{}).length || Object.keys(m.awayStats||{}).length;
  if (!hasStats) return '';

  const bars = STAT_BAR_ORDER.map(key => {
    const hv = parseFloat(m.homeStats[key]);
    const av = parseFloat(m.awayStats[key]);
    if (isNaN(hv) && isNaN(av)) return '';
    const h = isNaN(hv) ? 0 : hv, a = isNaN(av) ? 0 : av;
    const total = h + a || 1;
    const hPct = (h/total*100).toFixed(1), aPct = (a/total*100).toFixed(1);
    return `<div class="stat-bar-row">
      <div class="stat-bar-labels"><span>${m.homeStats[key] ?? '–'}</span><span class="stat-name">${STAT_LABELS[key]||key}</span><span>${m.awayStats[key] ?? '–'}</span></div>
      <div class="stat-bar-track"><div class="stat-bar-home" style="width:${hPct}%"></div><div class="stat-bar-away" style="width:${aPct}%"></div></div>
    </div>`;
  }).join('');

  if (!bars) return '';

  return `<div class="modal-section">
    <div class="modal-section-title">Team Stats</div>
    ${bars}
  </div>`;
}

function renderStatsTab() {
  renderLeaderboard();
}

function openMatchModal(matchId) {
  const m = allMatches.find(x => x.id === matchId);
  if (!m) return;

  const isDone = m.state === 'post', isLive = m.state === 'in', isPre = m.state === 'pre';
  const hw = m.homeWinner || m.homeAdvance, aw = m.awayWinner || m.awayAdvance;
  const sl = STAGE_LABEL[m.stage] || 'GROUP';

  let statusLine = '';
  if (isDone) statusLine = m.isShootout ? 'Full time (after penalties)' : 'Full time';
  else if (isLive) statusLine = m.displayClock ? `${m.displayClock}${m.period ? ` · Half ${m.period}` : ''}` : (m.statusDetail || 'Live');
  else statusLine = `Kicks off ${m.istShort} IST`;

  // Events sorted chronologically by their order in the array (ESPN already orders them)
  const eventsHtml = m.events.length
    ? m.events.map(ev => {
        const teamTag = ev.teamId === m.homeId ? m.home : ev.teamId === m.awayId ? m.away : '';
        return `<div class="event-row">
          <span class="event-minute">${ev.minute || ''}</span>
          <span class="event-icon">${eventIcon(ev)}</span>
          <span class="event-text">${eventLabel(ev)}${teamTag ? `<span class="event-team-tag">(${teamTag})</span>` : ''}</span>
        </div>`;
      }).join('')
    : `<div class="event-empty">${isPre ? 'Match hasn\'t started yet.' : 'No match events recorded.'}</div>`;

  const recapHtml = m.recap
    ? `<div class="modal-section"><div class="modal-section-title">Recap</div><div class="modal-recap">${m.recap}</div></div>`
    : '';

  const attendanceHtml = m.attendance
    ? `<div class="modal-status-line">👥 Attendance: ${m.attendance.toLocaleString('en-IN')}</div>`
    : '';

  const advanceHtml = m.isShootout && m.advanceNote
    ? `<div class="modal-status-line" style="color:var(--accent);font-weight:600;">🥅 ${m.advanceNote}</div>`
    : '';

  const homeScoreDisplay = (isDone||isLive)
    ? `${m.homeScore}${m.isShootout && m.homeShootoutScore!==null ? `<span class="shootout-score">(${m.homeShootoutScore})</span>` : ''}`
    : '–';
  const awayScoreDisplay = (isDone||isLive)
    ? `${m.awayScore}${m.isShootout && m.awayShootoutScore!==null ? `<span class="shootout-score">(${m.awayShootoutScore})</span>` : ''}`
    : '–';

  document.getElementById('modalPanel').innerHTML = `
    <div class="modal-header">
      <div>
        <div class="modal-stage">${sl} · ${m.istDate}</div>
        <div class="modal-venue">📍 ${m.venue}${m.city ? ', '+m.city : ''}</div>
      </div>
      <button class="modal-close" onclick="closeMatchModal()">✕</button>
    </div>
    <div class="modal-score-row">
      <div class="modal-team">
        <span class="modal-team-flag">${flag(m.home)}</span>
        <span class="modal-team-name${hw?' winner':''}">${m.home}</span>
      </div>
      <div class="modal-score-big">
        <span>${homeScoreDisplay}</span>
        <span class="vs-divider">${isPre ? 'VS' : '–'}</span>
        <span>${awayScoreDisplay}</span>
      </div>
      <div class="modal-team">
        <span class="modal-team-flag">${flag(m.away)}</span>
        <span class="modal-team-name${aw?' winner':''}">${m.away}</span>
      </div>
    </div>
    <div class="modal-status-line">${statusLine}</div>
    ${advanceHtml}
    ${attendanceHtml}
    <div class="modal-section">
      <div class="modal-section-title">Match Events</div>
      ${eventsHtml}
    </div>
    ${matchStatsHtml(m)}
    ${recapHtml}
  `;

  document.getElementById('modalOverlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeMatchModal() {
  document.getElementById('modalOverlay').classList.remove('visible');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMatchModal();
});

// ════════════════════════════════════════════════════════════
// Schedule rendering
// ════════════════════════════════════════════════════════════
function updateStats() {
  const live     = allMatches.filter(m => m.state === 'in').length;
  const finished = allMatches.filter(m => m.state === 'post').length;
  const upcoming = allMatches.filter(m => m.state === 'pre').length;
  const today    = allMatches.filter(m => m.istKey === todayKey()).length;
  document.getElementById('statsBar').innerHTML = `
    <span class="stat-item ${live>0?'live-stat':''}"><strong>${live}</strong> Live</span>
    <span class="stat-item"><strong>${today}</strong> Today (IST)</span>
    <span class="stat-item"><strong>${finished}</strong> Finished</span>
    <span class="stat-item"><strong>${upcoming}</strong> Upcoming</span>
    <span class="stat-item"><strong>${allMatches.length}</strong> Total</span>`;
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSchedule();
}

function renderSchedule() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const tk = todayKey();
  const filtered = allMatches.filter(m => {
    if (currentFilter === 'live'     && m.state !== 'in')   return false;
    if (currentFilter === 'today'    && m.istKey !== tk)     return false;
    if (currentFilter === 'upcoming' && m.state !== 'pre')   return false;
    if (currentFilter === 'finished' && m.state !== 'post')  return false;
    if (['group','r32','r16','qf','sf','final'].includes(currentFilter) && m.stage !== currentFilter) return false;
    if (q && !`${m.home} ${m.away} ${m.venue} ${m.city}`.toLowerCase().includes(q)) return false;
    return true;
  });

  if (!filtered.length) { document.getElementById('scheduleContent').innerHTML = '<div class="empty-state">No matches found.</div>'; return; }

  const byDate = {};
  filtered.forEach(m => {
    if (!byDate[m.istKey]) byDate[m.istKey] = { label: m.istDate, matches: [] };
    byDate[m.istKey].matches.push(m);
  });

  let html = '';
  for (const [dk, group] of Object.entries(byDate)) {
    const isToday = dk === tk;
    html += `<div class="day-block"><div class="day-header">
      ${isToday ? '<span class="day-today">TODAY</span>' : ''}
      <span class="day-date">${group.label.toUpperCase()}</span>
      <div class="day-line"></div>
    </div>`;
    for (const m of group.matches) {
      const isLive = m.state === 'in', isDone = m.state === 'post';
      const cardClass = isLive ? 'live' : isDone ? 'finished' : 'scheduled';
      const hsTxt = m.isShootout && m.homeShootoutScore!==null ? ` (${m.homeShootoutScore})` : '';
      const asTxt = m.isShootout && m.awayShootoutScore!==null ? ` (${m.awayShootoutScore})` : '';
      const scoreHtml = (isLive||isDone) ? `${m.homeScore}${hsTxt} – ${m.awayScore}${asTxt}` : 'vs';
      const scoreClass = isLive ? 'live-score' : '';
      let pill = isDone ? `<span class="status-pill finished">${m.isShootout ? 'FT-Pens' : 'FT'}</span>`
        : isLive ? `<span class="status-pill live">🔴 ${m.displayClock || m.statusDetail || 'LIVE'}</span>`
        : `<span class="status-pill scheduled">${m.istTime}</span>`;
      const sl = STAGE_LABEL[m.stage]||'GROUP', sc = STAGE_CLASS[m.stage]||'';
      html += `<div class="match-card ${cardClass}" onclick="openMatchModal('${m.id}')">
        <div class="team home"><span class="team-flag">${flag(m.home)}</span><span class="team-name">${m.home}</span></div>
        <div class="score-block"><div class="score ${scoreClass}">${scoreHtml}</div>${pill}</div>
        <div class="team away"><span class="team-flag">${flag(m.away)}</span><span class="team-name">${m.away}</span></div>
        <div class="match-footer">
          <span class="match-venue">📍 ${m.venue}${m.city?', '+m.city:''}</span>
          <span class="stage-badge ${sc}">${sl}</span>
        </div>
      </div>`;
    }
    html += '</div>';
  }
  document.getElementById('scheduleContent').innerHTML = html;
}

// ════════════════════════════════════════════════════════════
// Bracket rendering
// ════════════════════════════════════════════════════════════

// ESPN event IDs for each bracket slot — from the verified JSON sample.
// Bracket order (left to right): R32 → R16 → QF → SF → Final ← SF ← QF ← R16 ← R32
// Each pair of R32 matches feeds one R16 slot, etc.
// This fixed mapping tells us which ESPN event ids belong to which bracket slot.
// Slot naming: L=left side, R=right side, number = position top-to-bottom
// R32 slots (8 per side):
const BRACKET_SLOTS = {
  // Left R32 (top → bottom)
  r32L0: { label:'R32', ids:['760489'] }, // Germany/Paraguay
  r32L1: { label:'R32', ids:['760492'] }, // France/Sweden
  r32L2: { label:'R32', ids:['760486'] }, // South Africa/Canada
  r32L3: { label:'R32', ids:['760488'] }, // Netherlands/Morocco
  r32L4: { label:'R32', ids:['760497'] }, // Portugal/Croatia
  r32L5: { label:'R32', ids:['760496'] }, // Spain/Austria
  r32L6: { label:'R32', ids:['760494'] }, // USA/Bosnia
  r32L7: { label:'R32', ids:['760493'] }, // Belgium/Senegal
  // Right R32
  r32R0: { label:'R32', ids:['760487'] }, // Brazil/Japan
  r32R1: { label:'R32', ids:['760490'] }, // Ivory Coast/Norway
  r32R2: { label:'R32', ids:['760491'] }, // Mexico/Ecuador
  r32R3: { label:'R32', ids:['760495'] }, // England/Congo DR
  r32R4: { label:'R32', ids:['760500'] }, // Argentina/Cape Verde
  r32R5: { label:'R32', ids:['760499'] }, // Australia/Egypt
  r32R6: { label:'R32', ids:['760498'] }, // Switzerland/Algeria
  r32R7: { label:'R32', ids:['760501'] }, // Colombia/Ghana
};

// Build a lookup from id → match
function buildMatchLookup() {
  const lookup = {};
  allMatches.forEach(m => { lookup[m.id] = m; });
  return lookup;
}

// Get winner name of a match (or null if not finished / no advance)
function getWinner(m) {
  if (!m || m.state !== 'post') return null;
  if (m.homeWinner || m.homeAdvance) return m.home;
  if (m.awayWinner || m.awayAdvance) return m.away;
  return null;
}
function getLoser(m) {
  if (!m || m.state !== 'post') return null;
  if (m.homeWinner || m.homeAdvance) return m.away;
  if (m.awayWinner || m.awayAdvance) return m.home;
  return null;
}

// Render a single bracket match card
function bMatchHtml(m, label) {
  if (!m) {
    return `<div class="b-match">
      <div class="b-team tbd"><span class="b-team-name">TBD</span></div>
      <div class="b-team tbd"><span class="b-team-name">TBD</span></div>
    </div>`;
  }
  const isDone = m.state === 'post', isLive = m.state === 'in';
  const hw = m.homeWinner || m.homeAdvance, aw = m.awayWinner || m.awayAdvance;
  const hs = isDone||isLive ? `${m.homeScore}${m.isShootout && m.homeShootoutScore!==null ? `(${m.homeShootoutScore})` : ''}` : '';
  const as = isDone||isLive ? `${m.awayScore}${m.isShootout && m.awayShootoutScore!==null ? `(${m.awayShootoutScore})` : ''}` : '';
  const liveClass = isLive ? ' live' : '';

  return `<div class="b-match${liveClass}" onclick="openMatchModal('${m.id}')">
    <div class="b-team${hw?' winner':''}">
      <span class="b-team-flag">${flag(m.home)}</span>
      <span class="b-team-name">${m.home}</span>
      ${hs!=='' ? `<span class="b-team-score">${hs}</span>` : ''}
    </div>
    <div class="b-team${aw?' winner':''}">
      <span class="b-team-flag">${flag(m.away)}</span>
      <span class="b-team-name">${m.away}</span>
      ${as!=='' ? `<span class="b-team-score">${as}</span>` : ''}
    </div>
    <div class="b-match-meta">
      <span>${label||''}</span>
      <span>${isDone?(m.isShootout?'FT-Pens':'FT'):isLive?(m.displayClock||m.statusDetail||'LIVE'):m.istShort}</span>
    </div>
  </div>`;
}

// Build a TBD slot showing projected teams from two feeder matches
function tbdSlot(feeder1, feeder2) {
  const t1 = feeder1 ? (getWinner(feeder1)||'TBD') : 'TBD';
  const t2 = feeder2 ? (getWinner(feeder2)||'TBD') : 'TBD';
  const isTbd1 = t1 === 'TBD', isTbd2 = t2 === 'TBD';
  return `<div class="b-match">
    <div class="b-team${isTbd1?' tbd':''}">
      <span class="b-team-flag">${isTbd1?'❓':flag(t1)}</span>
      <span class="b-team-name">${t1}</span>
    </div>
    <div class="b-team${isTbd2?' tbd':''}">
      <span class="b-team-flag">${isTbd2?'❓':flag(t2)}</span>
      <span class="b-team-name">${t2}</span>
    </div>
    <div class="b-match-meta"><span>TBD</span><span>—</span></div>
  </div>`;
}

function renderBracket() {
  const lk = buildMatchLookup();

  // All event IDs verified against real ESPN API responses (July 2026 samples)
  const r32 = {
    // Left side (feeds into left half of bracket)
    L0: lk['760486'], // Canada vs South Africa   → feeds R16.L0 (Canada/Morocco)
    L1: lk['760488'], // Netherlands vs Morocco   → feeds R16.L0
    L2: lk['760489'], // Germany vs Paraguay      → feeds R16.L1 (Paraguay/France)
    L3: lk['760492'], // France vs Sweden         → feeds R16.L1
    L4: lk['760497'], // Spain vs Austria         → feeds R16.L2 (R32-11W/12W)
    L5: lk['760496'], // USA vs Bosnia            → feeds R16.L2
    L6: lk['760494'], // Portugal vs Croatia      → feeds R16.L3 (R32-9W/10W)
    L7: lk['760493'], // Belgium vs Senegal       → feeds R16.L3
    // Right side (feeds into right half of bracket)
    R0: lk['760487'], // Brazil vs Japan          → feeds R16.R0 (Brazil/Norway)
    R1: lk['760490'], // Ivory Coast vs Norway    → feeds R16.R0
    R2: lk['760491'], // Mexico vs Ecuador        → feeds R16.R1 (Mexico/England)
    R3: lk['760495'], // England vs Congo DR      → feeds R16.R1
    R4: lk['760500'], // Argentina vs Cape Verde  → feeds R16.R2 (R32-14W/16W)
    R5: lk['760499'], // Australia vs Egypt       → feeds R16.R2
    R6: lk['760498'], // Switzerland vs Algeria   → feeds R16.R3 (R32-13W/15W)
    R7: lk['760501'], // Colombia vs Ghana        → feeds R16.R3
  };

  // R16 — hardcoded by verified ESPN event IDs from API sample
  // 760502: Canada vs Morocco    (L0) — Houston, Jul 4
  // 760503: Paraguay vs France   (L1) — Philadelphia, Jul 4
  // 760506: R32-11W vs R32-12W  (L2) — AT&T Stadium, Jul 6
  // 760507: R32-9W  vs R32-10W  (L3) — Lumen Field, Jul 6
  // 760504: Brazil vs Norway     (R0) — MetLife, Jul 5
  // 760505: Mexico vs England    (R1) — Mexico City, Jul 5
  // 760509: R32-14W vs R32-16W  (R2) — Mercedes-Benz, Jul 7
  // 760508: R32-13W vs R32-15W  (R3) — BC Place, Jul 7
  const r16 = {
    L0: lk['760502'], L1: lk['760503'], L2: lk['760506'], L3: lk['760507'],
    R0: lk['760504'], R1: lk['760505'], R2: lk['760509'], R3: lk['760508'],
  };

  // QF — verified from ESPN API (name fields confirm which R16 slots feed each)
  // 760510: R16W1 vs R16W2 → QF.L0 (Gillette, Boston, Jul 9)
  // 760512: R16W3 vs R16W4 → QF.L1 (Hard Rock, Miami, Jul 11)
  // 760511: R16W5 vs R16W6 → QF.R0 (SoFi, LA, Jul 10)
  // 760513: R16W7 vs R16W8 → QF.R1 (Arrowhead, KC, Jul 11)
  const qf = {
    L0: lk['760510'], L1: lk['760512'],
    R0: lk['760511'], R1: lk['760513'],
  };

  // SF — verified from ESPN API
  // 760514: QF1W vs QF2W → SF.L (AT&T Dallas, Jul 14)
  // 760515: QF3W vs QF4W → SF.R (Mercedes-Benz Atlanta, Jul 15)
  const sf = { L: lk['760514'], R: lk['760515'] };

  // 3rd place (760516) and Final (760517) — verified
  const tpMatch    = lk['760516'] || null;
  const finalMatch = lk['760517'] || null;

  const card = (match, c1, c2, label) => match ? bMatchHtml(match, label) : tbdSlot(c1, c2);

  // Left-side tree node: children on left, connector, parent card on right
  function nodeL(parentCard, child1, child2) {
    return `<div style="display:flex;flex-direction:row;align-items:stretch;">
      <div style="display:flex;flex-direction:column;">${child1}${child2}</div>
      <div class="bt-connector-l"><div class="bt-conn-top"></div><div class="bt-conn-bot"></div></div>
      <div style="display:flex;align-items:center;">${parentCard}</div>
    </div>`;
  }

  // Right-side tree node: parent card on left, connector, children on right
  function nodeR(parentCard, child1, child2) {
    return `<div style="display:flex;flex-direction:row;align-items:stretch;">
      <div style="display:flex;align-items:center;">${parentCard}</div>
      <div class="bt-connector-r"><div class="bt-conn-top-l"></div><div class="bt-conn-bot-l"></div></div>
      <div style="display:flex;flex-direction:column;">${child1}${child2}</div>
    </div>`;
  }

  const leaf = (m, label) => `<div style="padding:5px 0;">${card(m, null, null, label)}</div>`;

  // Build left half inside-out: R32 leaves → R16 → QF → SF
  const L_r16_0 = nodeL(card(r16.L0, r32.L0, r32.L1, 'R16'), leaf(r32.L0,'R32'), leaf(r32.L1,'R32'));
  const L_r16_1 = nodeL(card(r16.L1, r32.L2, r32.L3, 'R16'), leaf(r32.L2,'R32'), leaf(r32.L3,'R32'));
  const L_r16_2 = nodeL(card(r16.L2, r32.L4, r32.L5, 'R16'), leaf(r32.L4,'R32'), leaf(r32.L5,'R32'));
  const L_r16_3 = nodeL(card(r16.L3, r32.L6, r32.L7, 'R16'), leaf(r32.L6,'R32'), leaf(r32.L7,'R32'));
  const L_qf_0  = nodeL(card(qf.L0, r16.L0, r16.L1, 'QF'),   L_r16_0, L_r16_1);
  const L_qf_1  = nodeL(card(qf.L1, r16.L2, r16.L3, 'QF'),   L_r16_2, L_r16_3);
  const L_sf    = nodeL(card(sf.L,  qf.L0,  qf.L1,  'SF'),   L_qf_0,  L_qf_1);

  // Build right half inside-out: R32 leaves → R16 → QF → SF
  const R_r16_0 = nodeR(card(r16.R0, r32.R0, r32.R1, 'R16'), leaf(r32.R0,'R32'), leaf(r32.R1,'R32'));
  const R_r16_1 = nodeR(card(r16.R1, r32.R2, r32.R3, 'R16'), leaf(r32.R2,'R32'), leaf(r32.R3,'R32'));
  const R_r16_2 = nodeR(card(r16.R2, r32.R4, r32.R5, 'R16'), leaf(r32.R4,'R32'), leaf(r32.R5,'R32'));
  const R_r16_3 = nodeR(card(r16.R3, r32.R6, r32.R7, 'R16'), leaf(r32.R6,'R32'), leaf(r32.R7,'R32'));
  const R_qf_0  = nodeR(card(qf.R0, r16.R0, r16.R1, 'QF'),   R_r16_0, R_r16_1);
  const R_qf_1  = nodeR(card(qf.R1, r16.R2, r16.R3, 'QF'),   R_r16_2, R_r16_3);
  const R_sf    = nodeR(card(sf.R,  qf.R0,  qf.R1,  'SF'),   R_qf_0,  R_qf_1);

  const finalCard = finalMatch ? bMatchHtml(finalMatch, 'FINAL') : `<div class="b-match">
    <div class="b-team tbd"><span class="b-team-name">TBD</span></div>
    <div class="b-team tbd"><span class="b-team-name">TBD</span></div>
    <div class="b-match-meta"><span>FINAL · Jul 20, 12:30 AM IST</span></div>
  </div>`;

  const tpCard = tpMatch ? bMatchHtml(tpMatch, '3RD') : `<div class="b-match">
    <div class="b-team tbd"><span class="b-team-name">TBD</span></div>
    <div class="b-team tbd"><span class="b-team-name">TBD</span></div>
    <div class="b-match-meta"><span>3RD · Jul 19, 2:30 AM IST</span></div>
  </div>`;

  document.getElementById('bracketContent').innerHTML = `
  <div style="display:flex;flex-direction:row;align-items:center;gap:0;">
    ${L_sf}
    <div class="bracket-center">
      <div class="bt-round-label">Final<br><small>Jul 19–20</small></div>
      ${finalCard}
      <div class="trophy-slot"><div class="trophy-icon">🏆</div><div class="trophy-date">CHAMPIONS</div></div>
      <div class="bt-round-label" style="margin-top:8px;">3rd Place<br><small>Jul 18–19</small></div>
      ${tpCard}
    </div>
    ${R_sf}
  </div>`;
}


document.getElementById('exportToolbar').classList.add('visible');
fetchAll();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — Schedule & Results</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a38;
    --accent: #c9a73a;
    --accent2: #4e9af1;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --live: #e84040;
    --win: #3dba6a;
    --scheduled: #4e9af1;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    font-size: 14px;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .trophy { font-size: 28px; }

  .title-block h1 {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--accent);
    line-height: 1;
  }

  .title-block p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(232,64,64,0.12);
    border: 1px solid rgba(232,64,64,0.3);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    color: var(--live);
    letter-spacing: 1px;
    display: none;
  }

  .live-badge.visible { display: flex; }

  .pulse {
    width: 6px; height: 6px;
    background: var(--live);
    border-radius: 50%;
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .last-updated {
    font-size: 11px;
    color: var(--muted);
  }

  .refresh-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font-body);
    transition: border-color 0.2s;
  }

  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  .controls {
    padding: 16px 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 65px;
    z-index: 99;
  }

  .filter-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font-body);
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(201,167,58,0.08);
  }

  .filter-btn.live-filter.active {
    border-color: var(--live);
    color: var(--live);
    background: rgba(232,64,64,0.08);
  }

  .search-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-family: var(--font-body);
    outline: none;
    width: 180px;
    transition: border-color 0.2s;
  }

  .search-input:focus { border-color: var(--accent2); }
  .search-input::placeholder { color: var(--muted); }

  .main { padding: 0 24px 40px; max-width: 1100px; margin: 0 auto; }

  .day-block { margin-top: 28px; }

  .day-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .day-label {
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--muted);
  }

  .day-date {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--text);
    letter-spacing: 1px;
  }

  .day-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .match-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    transition: border-color 0.2s;
    position: relative;
    overflow: hidden;
  }

  .match-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--border);
  }

  .match-card.live::before { background: var(--live); }
  .match-card.finished::before { background: var(--win); }
  .match-card.scheduled::before { background: var(--scheduled); }

  .match-card:hover { border-color: #3a3a50; }

  .team {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .team.away { flex-direction: row-reverse; }

  .team-flag { font-size: 22px; line-height: 1; }

  .team-name {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
  }

  .team.away .team-name { text-align: right; }

  .score-block {
    text-align: center;
    min-width: 80px;
  }

  .score {
    font-family: var(--font-display);
    font-size: 28px;
    letter-spacing: 4px;
    line-height: 1;
    color: var(--text);
  }

  .score.live-score { color: var(--live); }

  .match-meta {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .status-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .status-pill.live { background: rgba(232,64,64,0.15); color: var(--live); }
  .status-pill.finished { background: rgba(61,186,106,0.12); color: var(--win); }
  .status-pill.scheduled { background: rgba(78,154,241,0.12); color: var(--scheduled); }

  .match-info {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    margin-top: 4px;
  }

  .match-info-item {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .stage-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(201,167,58,0.1);
    color: var(--accent);
  }

  .stage-badge.r32 { background: rgba(78,154,241,0.1); color: var(--accent2); }
  .stage-badge.r16 { background: rgba(147,112,219,0.1); color: #a080e8; }
  .stage-badge.qf { background: rgba(255,140,0,0.1); color: #ffa040; }
  .stage-badge.sf { background: rgba(255,80,80,0.1); color: #ff6060; }
  .stage-badge.final { background: rgba(201,167,58,0.2); color: var(--accent); border: 1px solid rgba(201,167,58,0.3); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .error-banner {
    background: rgba(232,64,64,0.08);
    border: 1px solid rgba(232,64,64,0.2);
    color: #f08080;
    padding: 12px 18px;
    border-radius: 8px;
    margin: 20px 0 0;
    font-size: 13px;
    display: none;
  }

  .error-banner.visible { display: block; }

  .loading {
    text-align: center;
    padding: 60px;
    color: var(--muted);
  }

  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .stats-bar {
    display: flex;
    gap: 20px;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }

  .stat-item strong { color: var(--text); font-weight: 600; }
  .stat-item.live-stat strong { color: var(--live); }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    .controls { padding: 12px 16px; top: 61px; }
    .main { padding: 0 16px 40px; }
    .match-card { grid-template-columns: 1fr auto 1fr; padding: 12px 14px; gap: 10px; }
    .team-name { font-size: 12px; }
    .score { font-size: 22px; }
    .team-flag { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="trophy">🏆</div>
    <div class="title-block">
      <h1>FIFA WORLD CUP 2026</h1>
      <p>ALL 104 MATCHES · TIMES IN IST</p>
    </div>
  </div>
  <div class="header-right">
    <div class="live-badge" id="liveBadge"><div class="pulse"></div>LIVE</div>
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" onclick="fetchMatches()">↻ Refresh</button>
  </div>
</header>

<div class="stats-bar" id="statsBar"></div>

<div class="controls" id="controls">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn live-filter" onclick="setFilter('live', this)">🔴 Live</button>
  <button class="filter-btn" onclick="setFilter('today', this)">Today</button>
  <button class="filter-btn" onclick="setFilter('upcoming', this)">Upcoming</button>
  <button class="filter-btn" onclick="setFilter('finished', this)">Finished</button>
  <button class="filter-btn" onclick="setFilter('Group', this)">Group Stage</button>
  <button class="filter-btn" onclick="setFilter('Round of 32', this)">R32</button>
  <button class="filter-btn" onclick="setFilter('Round of 16', this)">R16</button>
  <button class="filter-btn" onclick="setFilter('Quarterfinal', this)">QF</button>
  <button class="filter-btn" onclick="setFilter('Semifinal', this)">SF</button>
  <button class="filter-btn" onclick="setFilter('Final', this)">Final</button>
  <input type="text" class="search-input" id="searchInput" placeholder="Search team..." oninput="renderMatches()">
</div>

<div class="main">
  <div class="error-banner" id="errorBanner"></div>
  <div id="content"><div class="loading"><div class="spinner"></div>Loading matches...</div></div>
</div>

<script>
const ESPN_URL = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?limit=200&dates=20260611-20260719';

// Flag emoji map
const FLAGS = {
  'Mexico': '🇲🇽', 'South Africa': '🇿🇦', 'Korea Republic': '🇰🇷', 'South Korea': '🇰🇷',
  'Czechia': '🇨🇿', 'Czech Republic': '🇨🇿', 'Canada': '🇨🇦', 'Bosnia and Herzegovina': '🇧🇦',
  'Bosnia & Herzegovina': '🇧🇦', 'Qatar': '🇶🇦', 'Switzerland': '🇨🇭', 'Paraguay': '🇵🇾',
  'USA': '🇺🇸', 'United States': '🇺🇸', 'Brazil': '🇧🇷', 'Morocco': '🇲🇦', 'Haiti': '🇭🇹',
  'Scotland': '🏴󠁧󠁢󠁳󠁣󠁴󠁿', 'Australia': '🇦🇺', 'Türkiye': '🇹🇷', 'Turkey': '🇹🇷',
  'Germany': '🇩🇪', 'Curaçao': '🇨🇼', 'Curacao': '🇨🇼', 'Ivory Coast': '🇨🇮',
  "Côte d'Ivoire": '🇨🇮', 'Ecuador': '🇪🇨', 'Netherlands': '🇳🇱', 'Japan': '🇯🇵',
  'Sweden': '🇸🇪', 'Tunisia': '🇹🇳', 'Spain': '🇪🇸', 'Cape Verde': '🇨🇻',
  'Saudi Arabia': '🇸🇦', 'Uruguay': '🇺🇾', 'Belgium': '🇧🇪', 'Egypt': '🇪🇬',
  'Iran': '🇮🇷', 'New Zealand': '🇳🇿', 'France': '🇫🇷', 'Senegal': '🇸🇳',
  'Iraq': '🇮🇶', 'Norway': '🇳🇴', 'Argentina': '🇦🇷', 'Algeria': '🇩🇿',
  'Austria': '🇦🇹', 'Jordan': '🇯🇴', 'Portugal': '🇵🇹', 'DR Congo': '🇨🇩',
  'Congo DR': '🇨🇩', "Congo, DR": '🇨🇩', 'Uzbekistan': '🇺🇿', 'Colombia': '🇨🇴',
  'England': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'Croatia': '🇭🇷', 'Ghana': '🇬🇭', 'Panama': '🇵🇦',
  'Bosnia & Herz.': '🇧🇦', 'Cabo Verde': '🇨🇻',
};

function getFlag(name) {
  return FLAGS[name] || '🏳️';
}

let allMatches = [];
let currentFilter = 'all';

function stageLabel(name) {
  if (!name) return '';
  const n = name.toLowerCase();
  if (n.includes('group')) return 'GROUP';
  if (n.includes('32') || n.includes('round of 32')) return 'R32';
  if (n.includes('16') || n.includes('round of 16')) return 'R16';
  if (n.includes('quarter')) return 'QF';
  if (n.includes('semi')) return 'SF';
  if (n.includes('final') && !n.includes('semi') && !n.includes('quarter') && !n.includes('third')) return 'FINAL';
  if (n.includes('third') || n.includes('3rd') || n.includes('place')) return '3RD';
  return name.toUpperCase();
}

function stageBadgeClass(label) {
  if (label === 'R32') return 'r32';
  if (label === 'R16') return 'r16';
  if (label === 'QF') return 'qf';
  if (label === 'SF' || label === '3RD') return 'sf';
  if (label === 'FINAL') return 'final';
  return '';
}

function toIST(utcStr) {
  const d = new Date(utcStr);
  return new Date(d.getTime() + (5.5 * 60 * 60 * 1000));
}

function formatISTDate(ist) {
  return ist.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}

function formatISTTime(ist) {
  return ist.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'UTC' }).toUpperCase();
}

function getISTDateKey(ist) {
  const y = ist.getUTCFullYear();
  const m = String(ist.getUTCMonth()+1).padStart(2,'0');
  const d = String(ist.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function todayISTKey() {
  const now = new Date();
  const ist = toIST(now.toISOString());
  return getISTDateKey(ist);
}

async function fetchMatches() {
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>Fetching live data...</div>';
  document.getElementById('errorBanner').classList.remove('visible');

  try {
    const res = await fetch(ESPN_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    allMatches = (data.events || []).map(event => {
      const comp = event.competitions?.[0] || {};
      const status = comp.status?.type || {};
      const competitors = comp.competitors || [];
      const home = competitors.find(c => c.homeAway === 'home') || competitors[0] || {};
      const away = competitors.find(c => c.homeAway === 'away') || competitors[1] || {};
      const ist = toIST(event.date);
      const season = data.season || {};
      const note = comp.notes?.[0]?.headline || '';

      return {
        id: event.id,
        date: event.date,
        ist,
        istDateKey: getISTDateKey(ist),
        istDate: formatISTDate(ist),
        istTime: formatISTTime(ist),
        home: home.team?.displayName || '?',
        away: away.team?.displayName || '?',
        homeScore: home.score ?? '–',
        awayScore: away.score ?? '–',
        statusState: status.state || 'pre',  // pre / in / post
        statusName: status.shortDetail || status.description || '–',
        stage: note || event.name || '',
        venue: comp.venue?.fullName || '',
        city: comp.venue?.address?.city || '',
      };
    });

    // Sort by date
    allMatches.sort((a, b) => new Date(a.date) - new Date(b.date));

    updateStats();
    renderMatches();
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});

  } catch (err) {
    document.getElementById('errorBanner').textContent = `Could not load live data from ESPN API: ${err.message}. Check your connection and try refreshing.`;
    document.getElementById('errorBanner').classList.add('visible');
    document.getElementById('content').innerHTML = '<div class="empty-state">No data loaded. Try refreshing.</div>';
  }
}

function updateStats() {
  const live = allMatches.filter(m => m.statusState === 'in').length;
  const finished = allMatches.filter(m => m.statusState === 'post').length;
  const upcoming = allMatches.filter(m => m.statusState === 'pre').length;
  const todayKey = todayISTKey();
  const today = allMatches.filter(m => m.istDateKey === todayKey).length;

  document.getElementById('statsBar').innerHTML = `
    <span class="stat-item ${live > 0 ? 'live-stat' : ''}"><strong>${live}</strong> Live</span>
    <span class="stat-item"><strong>${today}</strong> Today (IST)</span>
    <span class="stat-item"><strong>${finished}</strong> Finished</span>
    <span class="stat-item"><strong>${upcoming}</strong> Upcoming</span>
    <span class="stat-item"><strong>${allMatches.length}</strong> Total</span>
  `;

  if (live > 0) {
    document.getElementById('liveBadge').classList.add('visible');
  } else {
    document.getElementById('liveBadge').classList.remove('visible');
  }
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMatches();
}

function renderMatches() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const todayKey = todayISTKey();

  let filtered = allMatches.filter(m => {
    // Filter by status/stage
    if (currentFilter === 'live' && m.statusState !== 'in') return false;
    if (currentFilter === 'today' && m.istDateKey !== todayKey) return false;
    if (currentFilter === 'upcoming' && m.statusState !== 'pre') return false;
    if (currentFilter === 'finished' && m.statusState !== 'post') return false;
    if (['Group', 'Round of 32', 'Round of 16', 'Quarterfinal', 'Semifinal', 'Final'].includes(currentFilter)) {
      const s = m.stage.toLowerCase();
      const f = currentFilter.toLowerCase();
      if (!s.includes(f)) return false;
    }
    // Search
    if (search && !`${m.home} ${m.away} ${m.venue} ${m.city}`.toLowerCase().includes(search)) return false;
    return true;
  });

  if (filtered.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state">No matches found.</div>';
    return;
  }

  // Group by IST date
  const byDate = {};
  filtered.forEach(m => {
    if (!byDate[m.istDateKey]) byDate[m.istDateKey] = { label: m.istDate, matches: [] };
    byDate[m.istDateKey].matches.push(m);
  });

  let html = '';
  Object.entries(byDate).forEach(([dateKey, group]) => {
    const isToday = dateKey === todayKey;
    html += `<div class="day-block">
      <div class="day-header">
        <span class="day-label">${isToday ? '● TODAY' : ''}</span>
        <span class="day-date">${group.label}</span>
        <div class="day-line"></div>
      </div>`;

    group.matches.forEach(m => {
      const isLive = m.statusState === 'in';
      const isFinished = m.statusState === 'post';
      const cardClass = isLive ? 'live' : isFinished ? 'finished' : 'scheduled';
      const scoreDisplay = isFinished || isLive
        ? `${m.homeScore} – ${m.awayScore}`
        : 'vs';
      const scoreClass = isLive ? 'live-score' : '';

      let statusText = m.istTime;
      if (isLive) statusText = m.statusName;
      else if (isFinished) statusText = 'FT';

      let statusPill = '';
      if (isLive) statusPill = `<span class="status-pill live">🔴 ${m.statusName}</span>`;
      else if (isFinished) statusPill = `<span class="status-pill finished">FT</span>`;
      else statusPill = `<span class="status-pill scheduled">${m.istTime}</span>`;

      const sl = stageLabel(m.stage);
      const sc = stageBadgeClass(sl);

      html += `<div class="match-card ${cardClass}">
        <div class="team home">
          <span class="team-flag">${getFlag(m.home)}</span>
          <span class="team-name">${m.home}</span>
        </div>
        <div class="score-block">
          <div class="score ${scoreClass}">${scoreDisplay}</div>
          ${statusPill}
        </div>
        <div class="team away">
          <span class="team-flag">${getFlag(m.away)}</span>
          <span class="team-name">${m.away}</span>
        </div>
        <div class="match-info">
          <span class="match-info-item">📍 ${m.venue}${m.city ? ', ' + m.city : ''}</span>
          <span class="stage-badge ${sc}">${sl}</span>
        </div>
      </div>`;
    });

    html += '</div>';
  });

  document.getElementById('content').innerHTML = html;
}

// Auto-refresh every 60 seconds if live matches exist
setInterval(() => {
  if (allMatches.some(m => m.statusState === 'in')) {
    fetchMatches();
  }
}, 60000);

// Initial load
fetchMatches();
</script>
</body>
</html>
